{% load i18n %}
{% if message %}
    <div class="mb-6 rounded border border-amber-300 bg-amber-50 px-4 py-3 text-sm text-amber-900" role="alert" data-mfa-reminder>
        {{ message }}
        {% if security_url %}<a href="{{ security_url }}" class="ms-2 font-medium underline">{% translate "Set up now" context "security" %}</a>{% endif %}
    </div>
{% endif %}
