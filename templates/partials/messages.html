{% load i18n %}
{% comment %}Flash messages (original session('status')). Error messages use role="alert".{% endcomment %}
{% if messages %}
    <div class="mb-4 space-y-2">
        {% for message in messages %}
            <div x-data="dismissible" x-show="visible"
                 class="flex items-start justify-between gap-3 rounded px-3 py-2 text-sm {% if message.level_tag == 'error' %}bg-red-50 text-red-800{% elif message.level_tag == 'warning' %}bg-amber-50 text-amber-900{% else %}bg-emerald-50 text-emerald-800{% endif %}"
                 role="{% if message.level_tag == 'error' %}alert{% else %}status{% endif %}">
                <span>{{ message }}</span>
                <button type="button" x-on:click="dismiss" class="text-current opacity-60 hover:opacity-100" aria-label="{% translate 'Close' context 'common' %}">&times;</button>
            </div>
        {% endfor %}
    </div>
{% endif %}
