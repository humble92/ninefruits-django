{% comment %}Icons of the error pages (outline, 24x24, current colour): search, lock, refresh,
warning, clock, error, pause.{% endcomment %}<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if icon == "search" %}<circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/><path d="M8.5 8.5l5 5M13.5 8.5l-5 5"/>
{% elif icon == "lock" %}<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><path d="M12 15v2"/>
{% elif icon == "refresh" %}<path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/>
{% elif icon == "warning" %}<path d="M12 3.5 21.5 20h-19z"/><path d="M12 10v4"/><path d="M12 17h.01"/>
{% elif icon == "clock" %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif icon == "pause" %}<circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/>
{% else %}<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5h.01"/>
{% endif %}</svg>
