{% load i18n %}<!DOCTYPE html>
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>{{ status }} · {{ error.title }}</title>
    {% comment %}Self-contained layout of the 400 and 500 pages: no database, no built assets.{% endcomment %}
    <style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fafafa;color:#18181b;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}</style>
</head>
<body>
    <main>{% block content %}{% endblock %}</main>
</body>
</html>
